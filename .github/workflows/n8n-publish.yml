# Publica n8n-nodes-screenshot-happy en npm mediante GitHub Actions, con
# procedencia (provenance) firmada -- requisito obligatorio de n8n desde el
# 1 de mayo de 2026 para poder enviar el paquete a revision/verificacion.
#
# La procedencia via Sigstore SOLO funciona cuando el repositorio de origen
# es PUBLICO -- por eso este workflow vive en un repositorio dedicado y
# publico (solo el codigo del nodo, sin nada del backend privado).
#
# --- QUE CONFIGURAR EN NPMJS.COM (solo quien tenga acceso al paquete) ------
#
# Trusted Publisher / OIDC (sin secretos):
#   1. En npmjs.com, pagina del paquete -> Settings -> "Trusted Publisher"
#      -> "GitHub Actions" y rellenar exactamente:
#        Organization or user: ghezamcapital
#        Repository:           n8n-nodes-screenshot-happy
#        Workflow filename:    n8n-publish.yml
#        Environment name:     (dejar en blanco)
#   2. Marcar "Allow npm publish" (si no, cada publicacion queda en estado
#      "stage" y hay que aprobarla a mano en npmjs.com con 2FA).
#   3. No hace falta ningun secret NPM_TOKEN: GitHub emite un token OIDC de
#      un solo uso que este workflow intercambia por permiso de
#      publicacion. Requiere npm CLI >= 11.5.1 y Node >= 22.14.0 -- el paso
#      "Upgrade npm" de abajo se asegura de esto en cada ejecucion.
#
# --- COMO EJECUTARLO ---------------------------------------------------
#
# Actions -> "Publish n8n community node" -> "Run workflow" -> escribir
# "publish" en el campo de confirmacion -> "Run workflow".

name: Publish n8n community node

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "publish" para confirmar la publicacion en npm'
        required: true
        default: ''

jobs:
  publish:
    name: Publish to npm (provenance)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'

    permissions:
      # Necesario para que GitHub emita el token OIDC de procedencia (provenance).
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing/OIDC requiere npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
